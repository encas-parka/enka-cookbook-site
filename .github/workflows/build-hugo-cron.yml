name: Build Hugo (Cron si modifications dans /content)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read  # On n'a plus besoin d'écrire dans le repo

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          ref: enka-next
          fetch-depth: 0
      
      # Restaurer le SHA depuis le cache
      - name: Restaurer le dernier SHA depuis le cache
        id: cache-sha
        uses: actions/cache/restore@v4
        with:
          path: last-sha.txt
          key: last-successful-build-sha-${{ github.ref }}
      
      - name: Déterminer le SHA de référence
        id: reference-sha
        run: |
          if [ -f "last-sha.txt" ]; then
            LAST_SHA=$(cat last-sha.txt)
            if git rev-parse "$LAST_SHA" >/dev/null 2>&1; then
              echo "sha=$LAST_SHA" >> $GITHUB_OUTPUT
              echo "📌 Utilisation du SHA en cache : $LAST_SHA"
            else
              # Première exécution ou cache invalide
              LAST_SHA=$(git rev-parse HEAD~1)
              echo "sha=$LAST_SHA" >> $GITHUB_OUTPUT
              echo "🆕 Première exécution, utilisation de HEAD~1 : $LAST_SHA"
            fi
          else
            LAST_SHA=$(git rev-parse HEAD~1)
            echo "sha=$LAST_SHA" >> $GITHUB_OUTPUT
            echo "🆕 Aucun cache trouvé, utilisation de HEAD~1 : $LAST_SHA"
          fi
      
      - name: Détecter les changements dans /content
        id: detect-changes
        run: |
          LAST_SHA="${{ steps.reference-sha.outputs.sha }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          
          echo "🔍 Comparaison entre $LAST_SHA et $CURRENT_SHA"
          
          if git diff --name-only "$LAST_SHA" "$CURRENT_SHA" | grep -q "^content/"; then
            CHANGED_COUNT=$(git diff --name-only "$LAST_SHA" "$CURRENT_SHA" | grep "^content/" | wc -l)
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files=$CHANGED_COUNT" >> $GITHUB_OUTPUT
            
            echo "✅ $CHANGED_COUNT fichier(s) modifié(s) dans /content/ :"
            git diff --name-only "$LAST_SHA" "$CURRENT_SHA" | grep "^content/"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Aucun changement dans /content/"
          fi
      
      - name: Déclencher le build Cloudflare
        if: steps.detect-changes.outputs.has_changes == 'true'
        run: |
          echo "🚀 Déclenchement du build Cloudflare..."
          
          WEBHOOK_URL="${{ secrets.CLOUDFLARE_BUILD_WEBHOOK }}"
          
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ CLOUDFLARE_BUILD_WEBHOOK non configuré"
            exit 1
          fi
          
          CURRENT_SHA=$(git rev-parse HEAD)
          
          HTTP_CODE=$(curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"branch\": \"enka-next\",
              \"trigger\": \"github-cron\",
              \"commit_sha\": \"$CURRENT_SHA\"
            }" \
            -w "%{http_code}" \
            -s -o /dev/null)
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Webhook appelé avec succès (HTTP $HTTP_CODE)"
          else
            echo "❌ Erreur webhook (HTTP $HTTP_CODE)"
            exit 1
          fi
      
      # Sauvegarder le SHA dans le cache (que des changements aient été détectés ou non)
      - name: Sauvegarder le SHA actuel dans le cache
        if: success()  # ← Seulement si tout s'est bien passé
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "$CURRENT_SHA" > last-sha.txt
          echo "💾 SHA sauvegardé pour la prochaine exécution : $CURRENT_SHA"
      
      - name: Mettre à jour le cache
        if: success()  # ← Seulement si tout s'est bien passé
        uses: actions/cache/save@v4
        with:
          path: last-sha.txt
          key: last-successful-build-sha-${{ github.ref }}-${{ github.run_id }}
      
      - name: Résumé
        if: always()
        run: |
          if [ "${{ steps.detect-changes.outputs.has_changes }}" = "true" ]; then
            echo "🎉 Build déclenché pour ${{ steps.detect-changes.outputs.changed_files }} fichier(s)"
          else
            echo "😴 Aucun build nécessaire"
          fi
